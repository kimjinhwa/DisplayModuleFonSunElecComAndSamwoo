[env]
platform = espressif32@6.4.0
board = sunton_s3
; platform = C:/Users/ServerManager/platform-espressif32
; board = esp32s3box  ;동작한다 
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
framework = arduino
monitor_speed = 9600
monitor_filters = default
upload_port = COM3
monitor_port = COM3
;board_build.partitions = default_modify.csv
board_build.partitions = default_8MB.csv
; eModbus LDF(chain)가 ESP8266용 ESPAsyncTCP를 끌어와 ESP32 빌드가 깨짐. ESP32는 lib/AsyncTCP 사용.
lib_ignore = ESPAsyncTCP

[platformio]
default_envs = esp32_samwoo

; [env:esp32_Release]
; build_flags =
;     -D CONFIG_BLINK_GPIO=2
; 	-DCORE_DEBUG_LEVEL=1
; 	-DLOG_LEVEL=1
; 	-DBAUDRATEDEF=9600

[env:esp32_samwoo]
build_src_filter = +<*> -<hwtests/>
lib_deps =
	khoih-prog/Ethernet_Generic@^2.8.1
lib_ignore = ESPAsyncTCP, custom-Ethernet, eModbus, Ethernet
build_flags =
    -D CONFIG_BLINK_GPIO=2
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=1
	-DBAUDRATEDEF=9600
	-DUSE_ETHERNET_GENERIC
	-DETHERNET_USE_ESP32
	-D_ETG_LOGLEVEL_=1
	-DUSE_THIS_SS_PIN=10
	-I.
	-D FW_UPDATE_BASE=\"http://ift.iptime.org:81/Esp32UploadFirmware\"
	-D FW_UPDATE_META=\"esp32_samwoo.json\"
extra_scripts =
	pre:pre_build.py
	pre:post_build.py
    ;-DUSEWIFI

; 칩 단독 확인. ui.ino 대신 src/hwtests 만 빌드.
;   pio run -e hwtest_rtc -t upload
;   pio run -e hwtest_rs485 -t upload
;   pio run -e hwtest_w610 -t upload
[env:hwtest_rtc]
build_src_filter = -<*> +<hwtests/hwtest_rtc.cpp>
lib_ignore = ESPAsyncTCP, eModbus, custom-Ethernet
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DBAUDRATEDEF=9600

[env:hwtest_rs485]
build_src_filter = -<*> +<hwtests/hwtest_rs485.cpp>
lib_ignore = ESPAsyncTCP, eModbus, custom-Ethernet
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DBAUDRATEDEF=9600  
	-DRS485_UART_BAUD=19200

[env:hwtest_w610]
build_src_filter = -<*> +<hwtests/hwtest_w610.cpp>
lib_deps =
	khoih-prog/Ethernet_Generic@^2.8.1
lib_ignore = ESPAsyncTCP, custom-Ethernet, Ethernet, eModbus
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DBAUDRATEDEF=9600
	-DUSE_ETHERNET_GENERIC
	-DETHERNET_USE_ESP32
	-D_ETG_LOGLEVEL_=1
	-DUSE_THIS_SS_PIN=10

